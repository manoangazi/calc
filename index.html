<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://api.frankfurter.dev; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d1f3c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050d1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ManoCalc">
<title>ManoCalc</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="appbar">
  <label class="radix">
    <span class="sr-only">Mode</span>
    <select id="radix">
      <option value="10" selected>DEC</option>
      <option value="16">HEX</option>
      <option value="60">TIM</option>
      <!-- Last because it is the odd one out: the other three are bases, this is
           a conversion laid over the decimal one. -->
      <option value="con">CON</option>
    </select>
    <span class="chev" aria-hidden="true">&#9662;</span>
  </label>
  <span class="title">ManoCalc</span>
  <button type="button" class="icon-btn" data-act="history" aria-label="History" aria-expanded="false">&#8635;</button>
  <span class="icon disabled" aria-hidden="true">&#8942;</span>
</header>

<main class="display">
  <div id="expression" class="expression"></div>
  <div id="result" class="result" role="status" aria-live="polite" title="Long press to copy"></div>
  <!-- The converted value gets its own line rather than borrowing #hint, which
       is the shared fault caption and is wiped 1.4s after any flash message. -->
  <div id="converted" class="converted" aria-live="off" title="Long press to copy" hidden></div>
  <!-- Currency only. These are ECB daily reference rates rather than dealing
       rates, so the date is part of the answer. Announced politely because it
       changes without the user acting; #converted stays aria-live="off" so
       there is still only one announcement per conversion. -->
  <div id="rate-note" class="rate-note" aria-live="polite" hidden></div>
  <div id="hint" class="hint" role="status" aria-live="polite"></div>

  <div class="utility">
    <button type="button" class="util" data-act="menu" aria-haspopup="menu" aria-expanded="false" aria-label="More">&#8943;</button>
    <!-- Only shown in CON. The row is otherwise two buttons and a gap, so the
         pickers cost no height and landscape is unaffected. A <select> matches
         neither [data-cmd] nor [data-long], so the delegated key handlers on
         .utility ignore it. -->
    <div class="conv" hidden>
      <select id="conv-from" aria-label="Convert from"></select>
      <button type="button" class="conv-arrow" data-act="swap" aria-label="Swap the two units">&#8646;</button>
      <select id="conv-to" aria-label="Convert to"></select>
    </div>
    <!-- Both of the key's jobs are on its face: tap deletes, long-press clears.
         The AC label was previously only in the keypad, which left the clear
         gesture undiscoverable — and entirely unlabelled in TIM, whose pad has no
         AC key at all. Carrying the danger colours rather than the accent says
         the same thing the keypad's AC does: this one throws work away. -->
    <button type="button" class="util back" data-cmd="back" data-long="clear" aria-label="Backspace, hold to clear">&#9003;<span class="alt">AC</span></button>
  </div>

  <div class="menu" role="menu" hidden>
    <button type="button" role="menuitem" data-act="copy">Copy result</button>
    <!-- Hidden in hex, where results are exact integers and rounding has nothing
         to act on. -->
    <div class="dp-block">
    <p class="menu-label" id="dp-label">Decimal places</p>
    <div class="dp-row" role="group" aria-labelledby="dp-label">
      <button type="button" data-act="dp" data-dp="auto" aria-pressed="true">Auto</button>
      <button type="button" data-act="dp" data-dp="1" aria-pressed="false">1</button>
      <button type="button" data-act="dp" data-dp="2" aria-pressed="false">2</button>
      <button type="button" data-act="dp" data-dp="3" aria-pressed="false">3</button>
      <button type="button" data-act="dp" data-dp="4" aria-pressed="false">4</button>
      <button type="button" data-act="dp" data-dp="5" aria-pressed="false">5</button>
    </div>
    </div>

    <!-- CON only. Category is a set-once choice, so it lives here rather than
         taking a third picker's worth of room on the display card. -->
    <div class="cat-block" hidden>
    <p class="menu-label" id="cat-label">Convert</p>
    <div class="cat-row" role="group" aria-labelledby="cat-label"></div>
    <!-- The daily gate covers the normal case; this is for the one it cannot,
         where the caption went red offline and you have just reconnected. -->
    <button type="button" role="menuitem" data-act="rates">Refresh rates</button>
    </div>
  </div>
</main>

<!-- No AC on the pad: it moved to the backspace key, which shows both ⌫ and AC
     and does both jobs, so a second clear key here would be a duplicate. That
     frees the corner for ( ), and ( )'s old slot takes the root. -->
<div class="keypad dec" role="group" aria-label="Calculator keypad">
  <button type="button" class="key fn" data-cmd="paren" data-long="parenforce" aria-label="Parenthesis">( )<sup class="depth"></sup></button>
  <button type="button" class="key fn" data-cmd="sqrt" aria-label="Square root">&radic;</button>
  <button type="button" class="key op" data-cmd="op:^" aria-label="Exponent" aria-keyshortcuts="^">^</button>
  <button type="button" class="key op" data-cmd="op:/" aria-label="Divide">/</button>

  <button type="button" class="key" data-cmd="digit:7">7</button>
  <button type="button" class="key" data-cmd="digit:8">8</button>
  <button type="button" class="key" data-cmd="digit:9">9</button>
  <button type="button" class="key op" data-cmd="op:*" aria-label="Multiply">&times;</button>

  <button type="button" class="key" data-cmd="digit:4">4</button>
  <button type="button" class="key" data-cmd="digit:5">5</button>
  <button type="button" class="key" data-cmd="digit:6">6</button>
  <button type="button" class="key op" data-cmd="op:-" aria-label="Minus">&minus;</button>

  <button type="button" class="key" data-cmd="digit:1">1</button>
  <button type="button" class="key" data-cmd="digit:2">2</button>
  <button type="button" class="key" data-cmd="digit:3">3</button>
  <button type="button" class="key op" data-cmd="op:+" aria-label="Plus">+</button>

  <button type="button" class="key" data-cmd="digit:0">0</button>
  <button type="button" class="key" data-cmd="zeros">00</button>
  <button type="button" class="key" data-cmd="dot" aria-label="Decimal point">.</button>
  <button type="button" class="key equals" data-cmd="equals" aria-label="Equals">=</button>
</div>

<!-- Hex lays the digits out as a nibble table, 0 through F in reading order,
     rather than in phone order.

     The last row is bitwise rather than arithmetic, because that is what hex is
     for. It cost √ (integer roots are a curiosity), ^ (exponentiation is rare in
     hex, and worse, `^` means XOR in every language a hex user knows — leaving it
     as a power was a standing trap) and 00. Both still work from a keyboard.
     Shown in C's precedence order, tightest first: & then ⊻ then |. -->
<div class="keypad hex" role="group" aria-label="Hexadecimal keypad" hidden>
  <button type="button" class="key" data-cmd="digit:0">0</button>
  <button type="button" class="key" data-cmd="digit:1">1</button>
  <button type="button" class="key" data-cmd="digit:2">2</button>
  <button type="button" class="key" data-cmd="digit:3">3</button>
  <button type="button" class="key op" data-cmd="op:/" aria-label="Divide">/</button>

  <button type="button" class="key" data-cmd="digit:4">4</button>
  <button type="button" class="key" data-cmd="digit:5">5</button>
  <button type="button" class="key" data-cmd="digit:6">6</button>
  <button type="button" class="key" data-cmd="digit:7">7</button>
  <button type="button" class="key op" data-cmd="op:*" aria-label="Multiply">&times;</button>

  <button type="button" class="key" data-cmd="digit:8">8</button>
  <button type="button" class="key" data-cmd="digit:9">9</button>
  <button type="button" class="key" data-cmd="digit:A">A</button>
  <button type="button" class="key" data-cmd="digit:B">B</button>
  <button type="button" class="key op" data-cmd="op:-" aria-label="Minus">&minus;</button>

  <button type="button" class="key" data-cmd="digit:C">C</button>
  <button type="button" class="key" data-cmd="digit:D">D</button>
  <button type="button" class="key" data-cmd="digit:E">E</button>
  <button type="button" class="key" data-cmd="digit:F">F</button>
  <button type="button" class="key op" data-cmd="op:+" aria-label="Plus">+</button>

  <button type="button" class="key fn" data-cmd="paren" data-long="parenforce" aria-label="Parenthesis">( )<sup class="depth"></sup></button>
  <button type="button" class="key op" data-cmd="op:&amp;" aria-label="Bitwise AND">&amp;</button>
  <button type="button" class="key op" data-cmd="op:&#8891;" aria-label="Bitwise XOR">&#8891;</button>
  <button type="button" class="key op" data-cmd="op:|" aria-label="Bitwise OR">|</button>
  <button type="button" class="key equals" data-cmd="equals" aria-label="Equals">=</button>
</div>

<!-- TIM gives up two keys the mode cannot use — ^ (a duration raised to a power is
     not a quantity) and . (redundant once s exists) — which frees the top row for
     h, m and s in descending order, the order they are typed in, and lets the
     four operators stack in one column in / × − + order, something the decimal
     pad cannot do because ^ holds a top slot there.

     There is no AC key. Backspace already long-presses to clear, and the freed
     slot is what makes the grid come out at exactly 20 keys with no double-width
     key and no gap. It does mean the gesture is the only route to clear here
     rather than a shortcut for one.

     The colon spelling — 1:20.45 — stays legal input for a hardware keyboard and
     for history recall; it is simply not what the keys emit. -->
<div class="keypad tim" role="group" aria-label="Time keypad" hidden>
  <button type="button" class="key unit" data-cmd="unit:h" aria-label="Hours">h</button>
  <button type="button" class="key unit" data-cmd="unit:m" aria-label="Minutes">m</button>
  <button type="button" class="key unit" data-cmd="unit:s" aria-label="Seconds">s</button>
  <button type="button" class="key op" data-cmd="op:/" aria-label="Divide">/</button>

  <button type="button" class="key" data-cmd="digit:7">7</button>
  <button type="button" class="key" data-cmd="digit:8">8</button>
  <button type="button" class="key" data-cmd="digit:9">9</button>
  <button type="button" class="key op" data-cmd="op:*" aria-label="Multiply">&times;</button>

  <button type="button" class="key" data-cmd="digit:4">4</button>
  <button type="button" class="key" data-cmd="digit:5">5</button>
  <button type="button" class="key" data-cmd="digit:6">6</button>
  <button type="button" class="key op" data-cmd="op:-" aria-label="Minus">&minus;</button>

  <button type="button" class="key" data-cmd="digit:1">1</button>
  <button type="button" class="key" data-cmd="digit:2">2</button>
  <button type="button" class="key" data-cmd="digit:3">3</button>
  <button type="button" class="key op" data-cmd="op:+" aria-label="Plus">+</button>

  <button type="button" class="key" data-cmd="digit:0">0</button>
  <button type="button" class="key" data-cmd="zeros">00</button>
  <button type="button" class="key fn" data-cmd="paren" data-long="parenforce" aria-label="Parenthesis">( )<sup class="depth"></sup></button>
  <button type="button" class="key equals" data-cmd="equals" aria-label="Equals">=</button>
</div>

<section class="history" hidden aria-label="History">
  <header class="appbar">
    <button type="button" class="icon-btn" data-act="history-close" aria-label="Back">&#8592;</button>
    <span class="title">History</span>
    <button type="button" class="text-btn" data-act="history-clear">Clear</button>
  </header>
  <ul class="tape"></ul>
  <p class="tape-empty">Nothing calculated yet</p>
</section>

<script type="module" src="src/ui.js"></script>
<script type="module" src="src/sw-register.js"></script>
</body>
</html>
