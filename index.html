<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d1f3c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050d1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ManoCalc">
<title>ManoCalc</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="appbar">
  <label class="radix">
    <span class="sr-only">Number base</span>
    <select id="radix">
      <option value="10" selected>DEC</option>
      <option value="16">HEX</option>
    </select>
    <span class="chev" aria-hidden="true">&#9662;</span>
  </label>
  <span class="title">ManoCalc</span>
  <button type="button" class="icon-btn" data-act="history" aria-label="History" aria-expanded="false">&#8635;</button>
  <span class="icon disabled" aria-hidden="true">&#8942;</span>
</header>

<main class="display">
  <div id="expression" class="expression"></div>
  <div id="result" class="result" role="status" aria-live="polite" title="Long press to copy"></div>
  <div id="hint" class="hint" role="status" aria-live="polite"></div>

  <div class="utility">
    <button type="button" class="util" data-act="menu" aria-haspopup="menu" aria-expanded="false" aria-label="More">&#8943;</button>
    <button type="button" class="util back" data-cmd="back" data-long="clear" aria-label="Backspace">&#9003;</button>
  </div>

  <div class="menu" role="menu" hidden>
    <button type="button" role="menuitem" data-act="copy">Copy result</button>
    <!-- Hidden in hex, where results are exact integers and rounding has nothing
         to act on. -->
    <div class="dp-block">
    <p class="menu-label" id="dp-label">Decimal places</p>
    <div class="dp-row" role="group" aria-labelledby="dp-label">
      <button type="button" data-act="dp" data-dp="auto" aria-pressed="true">Auto</button>
      <button type="button" data-act="dp" data-dp="1" aria-pressed="false">1</button>
      <button type="button" data-act="dp" data-dp="2" aria-pressed="false">2</button>
      <button type="button" data-act="dp" data-dp="3" aria-pressed="false">3</button>
      <button type="button" data-act="dp" data-dp="4" aria-pressed="false">4</button>
      <button type="button" data-act="dp" data-dp="5" aria-pressed="false">5</button>
    </div>
    </div>
  </div>
</main>

<div class="keypad dec" role="group" aria-label="Calculator keypad">
  <button type="button" class="key clear" data-cmd="clear" aria-label="Clear">C</button>
  <button type="button" class="key fn" data-cmd="paren" data-long="parenforce" aria-label="Parenthesis">( )<sup class="depth"></sup></button>
  <button type="button" class="key op" data-cmd="op:^" aria-label="Exponent" aria-keyshortcuts="^">^</button>
  <button type="button" class="key op" data-cmd="op:/" aria-label="Divide">/</button>

  <button type="button" class="key" data-cmd="digit:7">7</button>
  <button type="button" class="key" data-cmd="digit:8">8</button>
  <button type="button" class="key" data-cmd="digit:9">9</button>
  <button type="button" class="key op" data-cmd="op:*" aria-label="Multiply">&times;</button>

  <button type="button" class="key" data-cmd="digit:4">4</button>
  <button type="button" class="key" data-cmd="digit:5">5</button>
  <button type="button" class="key" data-cmd="digit:6">6</button>
  <button type="button" class="key op" data-cmd="op:-" aria-label="Minus">&minus;</button>

  <button type="button" class="key" data-cmd="digit:1">1</button>
  <button type="button" class="key" data-cmd="digit:2">2</button>
  <button type="button" class="key" data-cmd="digit:3">3</button>
  <button type="button" class="key op" data-cmd="op:+" aria-label="Plus">+</button>

  <button type="button" class="key" data-cmd="digit:0">0</button>
  <button type="button" class="key" data-cmd="zeros">00</button>
  <button type="button" class="key" data-cmd="dot" aria-label="Decimal point">.</button>
  <button type="button" class="key equals" data-cmd="equals" aria-label="Equals">=</button>
</div>

<!-- Hex lays the digits out as a nibble table, 0 through F in reading order,
     rather than in phone order. Clear is "AC" here so it cannot be misread as
     the hex digit C sitting two keys away. -->
<div class="keypad hex" role="group" aria-label="Hexadecimal keypad" hidden>
  <button type="button" class="key" data-cmd="digit:0">0</button>
  <button type="button" class="key" data-cmd="digit:1">1</button>
  <button type="button" class="key" data-cmd="digit:2">2</button>
  <button type="button" class="key" data-cmd="digit:3">3</button>
  <button type="button" class="key op" data-cmd="op:/" aria-label="Divide">/</button>

  <button type="button" class="key" data-cmd="digit:4">4</button>
  <button type="button" class="key" data-cmd="digit:5">5</button>
  <button type="button" class="key" data-cmd="digit:6">6</button>
  <button type="button" class="key" data-cmd="digit:7">7</button>
  <button type="button" class="key op" data-cmd="op:*" aria-label="Multiply">&times;</button>

  <button type="button" class="key" data-cmd="digit:8">8</button>
  <button type="button" class="key" data-cmd="digit:9">9</button>
  <button type="button" class="key" data-cmd="digit:A">A</button>
  <button type="button" class="key" data-cmd="digit:B">B</button>
  <button type="button" class="key op" data-cmd="op:-" aria-label="Minus">&minus;</button>

  <button type="button" class="key" data-cmd="digit:C">C</button>
  <button type="button" class="key" data-cmd="digit:D">D</button>
  <button type="button" class="key" data-cmd="digit:E">E</button>
  <button type="button" class="key" data-cmd="digit:F">F</button>
  <button type="button" class="key op" data-cmd="op:+" aria-label="Plus">+</button>

  <button type="button" class="key clear" data-cmd="clear" aria-label="Clear">AC</button>
  <button type="button" class="key fn" data-cmd="paren" data-long="parenforce" aria-label="Parenthesis">( )<sup class="depth"></sup></button>
  <button type="button" class="key op" data-cmd="op:^" aria-label="Exponent" aria-keyshortcuts="^">^</button>
  <button type="button" class="key" data-cmd="zeros">00</button>
  <button type="button" class="key equals" data-cmd="equals" aria-label="Equals">=</button>
</div>

<section class="history" hidden aria-label="History">
  <header class="appbar">
    <button type="button" class="icon-btn" data-act="history-close" aria-label="Back">&#8592;</button>
    <span class="title">History</span>
    <button type="button" class="text-btn" data-act="history-clear">Clear</button>
  </header>
  <ul class="tape"></ul>
  <p class="tape-empty">Nothing calculated yet</p>
</section>

<script type="module" src="src/ui.js"></script>
<script type="module" src="src/sw-register.js"></script>
</body>
</html>
